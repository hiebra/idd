# Pasos de resincronización del wiki del proyecto en el archive (design D2 de
# add-project-wiki-toggle). Es la única fuente de esos pasos: /toggle-wiki
# (session-bootstrap.sh wiki on) los copia en operations.archive.guidance de
# openspec/config.yaml, entre "# wiki:archive-guidance:begin" y
# "# wiki:archive-guidance:end", y wiki off quita lo que hay entre las marcas.
# Mismo formato que esa lista: una entrada de YAML por línea, sin sangría.
# Si cambias este archivo, ejecuta /toggle-wiki dos veces en cada proyecto
# con el wiki habilitado para poner al día su config.yaml.
- "Con el wiki del proyecto habilitado, el wiki también forma parte del ciclo: en la forma recomendada, llega a la rama de origen en la misma fusión que el plan, el código y el archive; en la forma canónica, su commit también va a la rama permanente, después del commit del archive."
- "Después del commit del archivado, en la misma rama en la que se archivó, resincroniza el wiki del proyecto (.wiki/) con lo que tocó el change, con las operaciones del motor del wiki y en este orden. Si se archiva en la rama temporal, antes de fusionarla, las rutas que tocó el change son las del diff entre el merge-base de la rama con la rama de origen y el commit del archivado, más sus specs y sus ADRs."
- "Si se archiva en la rama de origen (forma canónica), las rutas que tocó el change salen de las fusiones de su propuesta y de su implementación con la rama de origen y del commit del archivado: el diff desde el primer padre del commit que trajo openspec/changes/<change>/proposal.md a la rama de origen hasta el commit del archivado, más sus specs y sus ADRs. El commit del wiki va igualmente aparte y después del commit del archivado."
- "1. Fija como fuentes, en el commit del archivado, el código, las specs y los ADRs que tocó el change: /wiki:ingest-collection . --adapter git --manifest-only --revision <commit del archivado> --include <rutas que tocó el change> --local"
- "2. Refresca los artículos cuyas fuentes cambiaron con /wiki:refresh, y compila las fuentes nuevas con /wiki:compile."
- "3. Revisa con el librarian, sin modificar nada, lo que quedó obsoleto o contradicho: /wiki:librarian scan --local"
- "4. Extrae las lecciones aprendidas del change sin escribir: parte de las lecciones candidatas que haya recibido la sesión de las sesiones del change y, si no ha recibido ninguna, de la sesión en curso: /wiki:ll --local --dry-run"
- "5. Presenta al usuario lo que propondrían los pasos 3 y 4, y escribe solo lo que confirme."
- "6. Pasa el lint del wiki con /wiki:lint --local, y con --fix, hasta que no dé errores."
- "7. Haz el commit del wiki aparte: el commit del wiki va después del commit del archivado, nunca en el mismo, porque .wiki/ está fuera de openspec/."
