schema: intent-driven
stack: javascript

# El acceso directo a las ramas permanentes está vetado: activa la única excepción
# a la regla estándar del ciclo, el change entero en una rama temporal (ADR-0020).
# Un proyecto creado desde la plantilla sin ese veto debe quitar esta línea.
x-main-protected: true

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  specs:
    - Must use spec-as-source skill
  tasks:
    - Must use spec-as-source skill
  adr:
    - "Haz `git fetch` antes de numerar un ADR nuevo, para ver los ADRs de las ramas concurrentes."
    - "Su número es uno más que el número más alto de `adr/` en `origin/<rama de origen>` y en todas las ramas remotas (`origin/*`), y en la rama de trabajo; léelo con `git ls-tree --name-only <ref> adr/` en cada una. La rama de origen es la última de x-main, o main."
    - "Si `check archive` avisa de que el número ya existe en la rama de origen, renumera los ADRs nuevos de la rama y sus referencias: aún no han llegado a la rama de origen, así que no se edita ningún ADR aceptado."

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

operations:
  archive:
    guidance:
      - "Dónde se archiva: la regla, la de la skill estándar de intent-driven, es archivar en la rama de origen (la última de x-main, o main) tras fusionar la implementación. La única excepción es que el acceso directo a las ramas permanentes esté vetado, y solo vale con x-main-protected: true en openspec/config.yaml: entonces el change se archiva en su rama temporal, antes de fusionarla, y la rama llega a la rama de origen en una sola fusión con --no-ff. La excepción existe por esa causa, la regla exige archivar en la rama de origen, y no es preferible a la regla. Archiva donde diga la puerta check archive."
      - "Después del commit del archivado, en la misma rama en la que se archivó, resincroniza el wiki del proyecto (.wiki/) con lo que tocó el change, con las operaciones del motor del wiki y en este orden. Si se archiva en la rama temporal (la excepción), antes de fusionarla, las rutas que tocó el change son las del diff entre el merge-base de la rama con la rama de origen y el commit del archivado, más sus specs y sus ADRs."
      - "Si se archiva en la rama de origen (la regla), las rutas que tocó el change salen de las fusiones de su propuesta y de su implementación con la rama de origen y del commit del archivado: el diff desde el primer padre del commit que trajo openspec/changes/<change>/proposal.md a la rama de origen hasta el commit del archivado, más sus specs y sus ADRs. El commit del wiki va igualmente aparte y después del commit del archivado."
      - "1. Fija como fuentes, en el commit del archivado, el código, las specs y los ADRs que tocó el change: /wiki:ingest-collection . --adapter git --manifest-only --revision <commit del archivado> --include <rutas que tocó el change> --local. Es lo único que se escribe antes de la confirmación del paso 5: es procedencia, no conocimiento."
      - "2. Evalúa sin escribir los artículos que citan las rutas que tocó el change: /wiki:refresh <artículo> --local, hasta su informe de decisiones, que dice qué fuente cambió o quedó contradicha."
      - "3. Extrae las lecciones aprendidas del change sin escribir: parte de las lecciones candidatas que haya recibido la sesión de las sesiones del change y, si no ha recibido ninguna, de la sesión en curso: /wiki:ll --local --dry-run"
      - "4. Revisa sin escribir los registros del inventario que el change completa o deja obsoletos: /wiki:inventory list --local"
      - "5. Presenta al usuario lo que proponen los pasos 2, 3 y 4, y escribe solo lo que confirme, en este orden: las decisiones del refresh (/wiki:refresh), las lecciones (/wiki:ll --local), el compile de las fuentes nuevas, incluidas las notas de lecciones (/wiki:compile --local), y el inventario (/wiki:inventory update <registro> --local)."
      - "6. Pasa el lint del wiki con /wiki:lint --local, y con --fix, hasta que no dé errores. Si --fix crea wiki/references/uncompiled-source-coverage.md, falta compilar una fuente: vuelve al compile del paso 5."
      - "7. Haz el commit del wiki aparte: el commit del wiki va después del commit del archivado, nunca en el mismo, porque .wiki/ está fuera de openspec/."
      - "8. Tras el commit del wiki, propón al usuario fusionar la rama del change con cada rama de x-main, en el orden de la lista: haz git fetch y ejecuta node .agents/openspec/branch-change.mjs merge-targets, que da solo las ramas que aún no contienen la rama del change. El usuario puede saltarse cualquiera, o todas. Para cada una que acepte, si merge-targets la marca con bringFirst, tráela antes con check merge <rama actual> <rama> y el ok del usuario a la resolución de los conflictos; después, ejecuta check merge <rama>, que da la orden. En un contenedor efímero, la fusión con una rama permanente se hace por PR: abre un PR de la rama de la sesión contra esa rama y recomienda fusionarlo con un commit de fusión, no con squash."
