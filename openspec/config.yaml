schema: intent-driven
stack: javascript

# El acceso directo a las ramas permanentes está vetado: activa la única excepción
# a la regla estándar del ciclo, el change entero en una rama temporal (ADR-0020).
# Un proyecto creado desde la plantilla sin ese veto debe quitar esta línea.
x-main-protected: true

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  specs:
    - Must use spec-as-source skill
  tasks:
    - Must use spec-as-source skill
  adr:
    - "Haz `git fetch` antes de numerar un ADR nuevo, para ver los ADRs de las ramas concurrentes."
    - "Su número es uno más que el número más alto de `adr/` en `origin/<rama de origen>` y en todas las ramas remotas (`origin/*`), y en la rama de trabajo; léelo con `git ls-tree --name-only <ref> adr/` en cada una. La rama de origen es la última de x-main, o main."
    - "Si `check archive` avisa de que el número ya existe en la rama de origen, renumera los ADRs nuevos de la rama y sus referencias: aún no han llegado a la rama de origen, así que no se edita ningún ADR aceptado."

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

operations:
  apply:
    guidance:
      - >-
        Standing instruction from the project owner: apply runs one tracked
        task per session. Take it as given that the user interrupts after every
        completed task; this is the built-in "User interrupts" pause, declared
        in advance. So in this session the task to work on is the first one the
        CLI returns with `done: false`.
      - >-
        Implement that task in this top-level interactive session. Do not
        delegate it to a subagent or any other non-interactive agent, so that
        every built-in pause (unclear task, design issue, added scope, error or
        blocker) is asked to the user and answered in this session.
      - >-
        When the task is marked `- [x]` and the rerun of the apply instructions
        confirms it, that pause applies: go to the built-in "On completion or
        pause, show status" step instead of continuing to the next task. Show
        it as completion if the CLI now reports `all_done`; otherwise as a
        pause whose reason is the session boundary and whose way forward is a
        new session (fresh context) running this same apply workflow for this
        change. The built-in loop resumes there from the first pending task, as
        any resumed apply does.
      - >-
        Change nothing else. Steps, CLI commands, checkbox updates, pause
        conditions, status and completion output, and completion criteria stay
        exactly as the built-in workflow defines them, so the change ends up as
        a single uninterrupted apply would leave it. Add nothing on account of
        the session split: no handoff or progress files, no notes or markers in
        the tracking file, no extra commits. This guidance applies only while
        implementing tasks, not to verification or any other workflow that
        reads this output.
  archive:
    guidance:
      - "Dónde se archiva: la regla, la de la skill estándar de intent-driven, es archivar en la rama de origen (la última de x-main, o main) tras fusionar la implementación. La única excepción es que el acceso directo a las ramas permanentes esté vetado, y solo vale con x-main-protected: true en openspec/config.yaml: entonces el change se archiva en su rama temporal, antes de fusionarla, y la rama llega a la rama de origen en una sola fusión con --no-ff. La excepción existe por esa causa, la regla exige archivar en la rama de origen, y no es preferible a la regla. Archiva donde diga la puerta check archive."
      - "Lo último del archive es proponer la fusión, tras su commit y, si estas indicaciones traen más pasos después de este, tras ellos: haz git fetch y propón al usuario fusionar la rama del change con cada rama de x-main, en el orden de la lista, pero solo con las que da node .agents/skills/openspec-git-discipline/scripts/branch-change.mjs merge-targets, que no da las que ya contienen la rama del change. El usuario puede saltarse cualquiera, o todas. Para cada una que acepte, si merge-targets la marca con bringFirst, tráela antes con check merge <rama actual> <rama> y el ok del usuario a la resolución de los conflictos; después, ejecuta check merge <rama>, que da la orden. En un contenedor efímero, la fusión con una rama permanente se hace por PR: abre un PR de la rama de la sesión contra esa rama y recomienda fusionarlo con un commit de fusión, no con squash."
