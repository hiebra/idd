schema: intent-driven
stack: javascript

# El acceso directo a las ramas permanentes está vetado: activa la única excepción
# a la regla estándar del ciclo, el change entero en una rama temporal (ADR-0020).
# Un proyecto creado desde la plantilla sin ese veto debe quitar esta línea.
x-main-protected: true

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  specs:
    - Must use spec-as-source skill
  tasks:
    - Must use spec-as-source skill
  adr:
    - "Haz `git fetch` antes de numerar un ADR nuevo, para ver los ADRs de las ramas concurrentes."
    - "Su número es uno más que el número más alto de `adr/` en `origin/<rama de origen>` y en todas las ramas remotas (`origin/*`), y en la rama de trabajo; léelo con `git ls-tree --name-only <ref> adr/` en cada una. La rama de origen es la última de x-main, o main."
    - "Si `check archive` avisa de que el número ya existe en la rama de origen, renumera los ADRs nuevos de la rama y sus referencias: aún no han llegado a la rama de origen, así que no se edita ningún ADR aceptado."

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

operations:
  archive:
    guidance:
      - "Dónde se archiva: hay dos formas del ciclo, y las dos se admiten. En la forma recomendada, el change se archiva en su rama temporal y la rama llega a la rama de origen (la última de x-main, o main) en una sola fusión con --no-ff; la forma recomendada conviene casi siempre, porque el plan, el código, el archive y el wiki llegan juntos y la rama permanente no recibe commits directos. En la forma canónica de intent-driven, el change se archiva en la rama de origen después de fusionar la implementación, con todas sus tasks hechas; la forma canónica conviene cuando el plan se revisa y se fusiona aparte o hay que reservar pronto los números de ADR, a cambio de tres fusiones y de commits del archive y del wiki en la rama permanente. La forma canónica es una forma admitida: archiva donde siga el usuario."
      - "Después del commit del archivado, en la misma rama en la que se archivó, resincroniza el wiki del proyecto (.wiki/) con lo que tocó el change, con las operaciones del motor del wiki y en este orden. Si se archiva en la rama temporal, antes de fusionarla, las rutas que tocó el change son las del diff entre el merge-base de la rama con la rama de origen y el commit del archivado, más sus specs y sus ADRs."
      - "Si se archiva en la rama de origen (forma canónica), las rutas que tocó el change salen de las fusiones de su propuesta y de su implementación con la rama de origen y del commit del archivado: el diff desde el primer padre del commit que trajo openspec/changes/<change>/proposal.md a la rama de origen hasta el commit del archivado, más sus specs y sus ADRs. El commit del wiki va igualmente aparte y después del commit del archivado."
      - "1. Fija como fuentes, en el commit del archivado, el código, las specs y los ADRs que tocó el change: /wiki:ingest-collection . --adapter git --manifest-only --revision <commit del archivado> --include <rutas que tocó el change> --local"
      - "2. Refresca los artículos cuyas fuentes cambiaron con /wiki:refresh, y compila las fuentes nuevas con /wiki:compile."
      - "3. Revisa con el librarian, sin modificar nada, lo que quedó obsoleto o contradicho: /wiki:librarian scan --local"
      - "4. Extrae las lecciones aprendidas del change sin escribir: parte de las lecciones candidatas que haya recibido la sesión de las sesiones del change y, si no ha recibido ninguna, de la sesión en curso: /wiki:ll --local --dry-run"
      - "5. Presenta al usuario lo que propondrían los pasos 3 y 4, y escribe solo lo que confirme."
      - "6. Pasa el lint del wiki con /wiki:lint --local, y con --fix, hasta que no dé errores."
      - "7. Haz el commit del wiki aparte: el commit del wiki va después del commit del archivado, nunca en el mismo, porque .wiki/ está fuera de openspec/."
